name: CI/CD Pipeline

on: 
    pull_request:
    push:
       branches:
        - main
    workflow_dispatch:   
    
permissions:
    contents: read
    id-token: write    

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
           - name: Checkout repository
             uses: actions/checkout@v4


           - name: Set up Java 21
             uses: actions/setup-java@v4
             with:
                distribution: temurin
                java-version: '21'
                cache: maven
           
           - name: Run Maven tests
             working-directory: application
             run: ./mvnw -B test    

           - name: Validate Docker image build
             run: docker build -t petclinic:test application


    deploy:
        needs: test
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest         
        steps:    
           - name: Checkout repository
             uses: actions/checkout@v4

           - name: Configure AWS credentials
             uses: aws-actions/configure-aws-credentials@v4
             with:
               role-to-assume: arn:aws:iam::521223133967:role/8byte-devops-assignment-staging-github-actions-role
               aws-region: ap-south-1  

           - name: Login to Amazon ECR
             id: login-ecr
             uses: aws-actions/amazon-ecr-login@v2

           - name: Build and push Docker image
             run: | 
               docker build -t 521223133967.dkr.ecr.ap-south-1.amazonaws.com/8byte-devops-assignment-staging-ecr-repo:${{ github.sha }} application
               docker push 521223133967.dkr.ecr.ap-south-1.amazonaws.com/8byte-devops-assignment-staging-ecr-repo:${{ github.sha }}
               echo "IMAGE_URI=521223133967.dkr.ecr.ap-south-1.amazonaws.com/8byte-devops-assignment-staging-ecr-repo:${{ github.sha }}" >> $GITHUB_ENV

           - name: Deploy to EC2 using SSM
             run: | 
                INSTANCE_ID=$(aws ec2 describe-instances \
                  --region ap-south-1 \
                  --filters "Name=tag:Name,Values=8byte-devops-assignment-staging-app" "Name=instance-state-name,Values=running" \
                  --query "Reservations[0].Instances[0].InstanceId" \
                  --output text)

                if [ "$INSTANCE_ID" = "None" ] || [ -z "$INSTANCE_ID" ]; then
                  echo "No running EC2 instance found with Name tag 8byte-devops-assignment-staging-app"
                  exit 1
                fi

                echo "Deploying to EC2 instance: $INSTANCE_ID"

                COMMAND_ID=$(aws ssm send-command \
                  --instance-ids "$INSTANCE_ID" \
                  --document-name "AWS-RunShellScript" \
                  --parameters commands="[\"aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 521223133967.dkr.ecr.ap-south-1.amazonaws.com\",\"docker pull $IMAGE_URI\",\"mkdir -p /opt/petclinic\",\"aws secretsmanager get-secret-value --secret-id 8byte-devops-assignment/staging/app-env --region ap-south-1 --query SecretString --output text > /opt/petclinic/app.env\",\"chmod 600 /opt/petclinic/app.env\",\"docker stop petclinic || true\",\"docker rm petclinic || true\",\"docker run -d --name petclinic --restart unless-stopped --env-file /opt/petclinic/app.env -p 9090:8080 --log-driver=awslogs --log-opt awslogs-region=ap-south-1 --log-opt awslogs-group=8byte-devops-assignment-staging-application-logs --log-opt awslogs-stream=petclinic $IMAGE_URI\"]" \
                  --query "Command.CommandId" \
                  --output text)
                sleep 20
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
